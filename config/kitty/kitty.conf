# Theme
# Generated by Noctalia's built-in Kitty template; updates when you change the
# Noctalia color scheme. To preview the static palette from the downloaded
# folder instead, comment the line below and uncomment the next one.
include themes/noctalia.conf
# include themes/noctalia.downloaded.conf

# Needed by the search kitten and the `kitty @` mappings below
allow_remote_control yes

# Pure black console - after the include so Noctalia's palette cannot re-tint it
# background              #000000
# background_opacity      1.0
# tab_bar_background      #000000
# active_tab_background   #000000
# inactive_tab_background #000000

# Font
font_family     SF Mono
# SF Mono is not installed on this machine; this is the fallback used until it is.
font_family     JetBrainsMono Nerd Font Mono
font_size       11

# SF Mono has no U+276F (fish's default prompt chevron) - borrow it
symbol_map U+276E-U+276F MesloLGS Nerd Font Mono

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (from Documents/kitty)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
